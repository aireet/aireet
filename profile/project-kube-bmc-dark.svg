<svg xmlns="http://www.w3.org/2000/svg" width="400" height="181" viewBox="0 0 400 181" font-family="-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;Noto Sans&#x27;,Helvetica,Arial,sans-serif"><rect x="0.5" y="0.5" width="399" height="180" rx="10" fill="#151b23" stroke="#3d444d"/><text x="24" y="40" font-size="17" font-weight="600" fill="#4493f8">kube-bmc</text><text x="24" y="70" font-size="13.5" fill="#9198a1">Server BMCs as Kubernetes resources: in-band</text><text x="24" y="91" font-size="13.5" fill="#9198a1">discovery without credentials, hardware health,</text><text x="24" y="112" font-size="13.5" fill="#9198a1">power control, a web dashboard, a kubectl plugin</text><text x="24" y="133" font-size="13.5" fill="#9198a1">and Grafana. An MCP endpoint lets AI agents</text><text x="24" y="154" font-size="13.5" fill="#9198a1">inspect and operate the servers.</text></svg>
